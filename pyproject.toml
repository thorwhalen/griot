[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "griot"
version = "0.0.4"
description = "Research a subject and write a spoken commentary script for it — reusable writers for braidio productions"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "commentary",
    "script",
    "writer",
    "research",
    "braidio",
    "tts",
    "podcast",
    "video-essay",
]
authors = [
    { name = "Thor Whalen" },
]
# Local federation packages carry no version pins (they co-evolve).
# braidio: the Script the writers produce, the formats' scripting guidance, the
# two audits. falaw: the one priced, cached LLM path. httpx + bs4: the tokenless
# research fetchers (Genius pages are scraped for lyrics).
dependencies = [
    "braidio",
    "falaw",
    "httpx",
    "beautifulsoup4",
]

license = "MIT"

[project.urls]
Homepage = "https://github.com/thorwhalen/griot"
Repository = "https://github.com/thorwhalen/griot"
Documentation = "https://thorwhalen.github.io/griot"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
# `python -m griot ...` (cw is stdlib-only).
cli = ["cw>=0.1.1,<0.2"]

# Packaging: the shipped skill lives at griot/data/skills/griot/ with a
# relative symlink from .claude/skills/. See tituli's pyproject for why both
# hatch lines are needed (the symlink is walked first and the real dir dropped).
[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".github", "scrap"]

[tool.hatch.build.targets.wheel]
packages = ["griot"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
    "griot",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.install]
extras = "cli"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = false

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
